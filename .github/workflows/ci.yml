name: CI

on:
  # Only run on manual pushes, not auto-sync commits.
  # Auto-sync commits start with "auto:" — we skip those in the job.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public repository: GITHUB_TOKEN needs no scopes because reads work
# anonymously and nothing in this workflow writes. Locking permissions
# to {} is the tightest default.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip auto-sync commits from dotkeeper's git timer
    if: "!startsWith(github.event.head_commit.message, 'auto:')"
    # ~3x the observed steady-state duration (build+test+vet+govulncheck runs
    # 4-5.5min). A hung step fails the job instead of squatting on a runner
    # for the account-wide 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure git identity for tests
        # Required: several tests (gitsync, e2e conflict, propagator) create
        # temporary repos and run `git commit`, which refuses without a
        # configured user. The temp repos live in `t.TempDir()` and are
        # cleaned up after the test — they're not included in the coverage
        # artifact, so this identity never leaves the runner.
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@dotkeeper.dev"

      - name: Build
        run: go build -tags noassets ./cmd/dotkeeper

      - name: Cross-compile sanity (windows/darwin)
        # Reports even if an earlier step failed: this compiles from the
        # checked-out source and asserts something no other step does.
        if: '!cancelled()'
        # dotkeeper supports Linux, macOS, and Windows. The host-arch build
        # above proves linux/amd64; this step proves the file-locking shim
        # and other platform-specific code compiles for darwin and windows.
        # CGO is off so we don't need the Apple/Windows cross toolchains.
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin  GOARCH=amd64 go build -tags noassets ./cmd/dotkeeper
          GOOS=darwin  GOARCH=arm64 go build -tags noassets ./cmd/dotkeeper
          GOOS=windows GOARCH=amd64 go build -tags noassets ./cmd/dotkeeper

      - name: Test with coverage (race-enabled)
        # Reports even if an earlier step failed: it builds its own test
        # binaries, so a darwin-only compile error upstream must not erase
        # the verdict of the entire test suite.
        if: '!cancelled()'
        # -race runs the Go data-race detector. Cheap on a single-package CI
        # run and surfaces concurrent-write bugs before they hit production —
        # the state.toml race fixed in PR #7 was exactly the class of bug
        # `-race` catches when properly exercised by tests.
        run: |
          go test -tags noassets -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "### Coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage profile
        # Deliberately WITHOUT `if: '!cancelled()'`. Unlike the verification
        # steps around it, this one consumes coverage.out written by the step
        # above; if that step did not run there is nothing to upload, and an
        # upload of a stale or absent profile is worse than no upload.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 30

      - name: Perf-budget gate (non-race)
        # Reports even if an earlier step failed. This is the step a red test
        # run used to hide: the budgets are a separate contract from
        # correctness, and one broken test must not leave them unmeasured.
        if: '!cancelled()'
        # Hot-path benchmarks have ns/op budgets in
        # internal/reconcile/perf_budget_test.go. They skip themselves under
        # -race because the detector adds 5–15× overhead and under
        # multi-package parallelism because contention doubles the
        # measured ns/op. This step runs only the reconcile package with
        # DK_PERF_GATE=1 set, so the gate has dedicated CPU and fires
        # reliably. ~7s wall-clock, dominated by testing.Benchmark sampling.
        env:
          DK_PERF_GATE: "1"
        run: go test -tags noassets -run TestPerfBudgets ./internal/reconcile/

      - name: Vet
        # Reports even if an earlier step failed; vet reads the source and
        # depends on nothing any previous step produced.
        if: '!cancelled()'
        run: go vet -tags noassets ./...

      - name: govulncheck
        # Reports even if an earlier step failed; the CVE verdict is
        # independent of whether the tests pass, and is exactly the thing you
        # least want withheld while the build is red.
        if: '!cancelled()'
        # Reachability-aware CVE scan. Module-only findings are reported, while
        # reachable advisories fail this required build job.
        # Version pinned for reproducibility; Dependabot bumps it.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -tags noassets ./...

  lint:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'auto:')"
    # Observed 25-45s; golangci-lint has its own --timeout 5m below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt drift is silent without a CI gate. golangci-lint doesn't
        # enforce gofmt by default, so run it explicitly here. Any file
        # that would be rewritten by `gofmt -w` fails the job and prints
        # the offending paths.
        run: |
          changed=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$changed" ]; then
            echo "::error::gofmt would rewrite the following files; run \`gofmt -w\` and commit:"
            echo "$changed"
            exit 1
          fi

      - name: golangci-lint
        # Baseline is clean (PR #15); lint is now a hard gate.
        # Version pinned for reproducibility; Dependabot bumps it.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          golangci-lint run --build-tags noassets --timeout 5m ./...

  fuzz-smoke:
    # Runs every declared fuzz target for a short time on every PR. This is
    # the lightweight "did anyone break the parsers" gate, distinct from a
    # nightly long-running fuzz workflow. Seed-corpus regressions are caught
    # by the normal test job; this job surfaces *new* crashes that only show
    # up under randomized input.
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: build`. This job checks out and builds
    # everything it needs itself, so gating it on `build` only meant a
    # compile error in `build` erased the fuzz result too. Independent gates
    # must each report their own verdict.
    if: "!startsWith(github.event.head_commit.message, 'auto:')"
    # Observed ~2min. Budget raised from 5 so that a genuinely failing target
    # (the loop below now runs every target instead of stopping at the first
    # failure) still fits, and so adding a fuzz target doesn't silently turn
    # the budget into a flake source.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz each target (30s each)
        # Per-target budget bumped from 20s to 30s after intermittent
        # "context deadline exceeded" failures on FuzzMachineConfigV2RoundTrip
        # and FuzzExpandContractPath: with -fuzztime=20s the harness's
        # internal deadline races with the last fuzz iteration's
        # completion, and a worker still finishing an exec at the 20s
        # mark trips the failure even though no real bug was found.
        # 30s leaves enough slack that legitimate completions land
        # inside the budget (~6 targets * 30s + overhead).
        #
        # Every target runs even when an earlier one fails: one broken parser
        # must not hide the state of the other five. Failures are collected
        # and the job still exits non-zero at the end, naming each one.
        #
        # A run that fuzzed nothing must never report success. The enumeration
        # below happens first precisely so the count can be checked: an empty
        # list is exactly what a wrong package path, a build that no longer
        # compiles, or a renamed Fuzz* function looks like, and the previous
        # shape turned all three into a green job that had tested nothing.
        run: |
          set -u
          pkgs=$(go list -tags noassets ./...)
          targets=""
          for pkg in $pkgs; do
            # `go test -list` enumerates fuzz targets in the package. The
            # `|| true` is here solely so grep's no-match exit status cannot
            # kill the step; the zero-target floor below is what makes
            # swallowing that status safe.
            for target in $(go test -tags noassets -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              targets="${targets}${targets:+ }${pkg}=${target}"
            done
          done

          if [ -z "$targets" ]; then
            # A batch that ran nothing has proven nothing; never report that as success.
            echo "::error::fuzz-smoke: no fuzz targets were found, so no units were run"
            echo "packages searched:" >&2
            echo "$pkgs" | sed 's/^/  - /' >&2
            exit 1
          fi

          failed=""
          total=0
          for entry in $targets; do
            pkg=${entry%=*}
            target=${entry#*=}
            total=$((total + 1))
            echo "::group::fuzz $pkg $target"
            if ! go test -tags noassets -run='^$' -fuzz="^${target}$" -fuzztime=30s "$pkg"; then
              echo "::error::fuzz target ${target} failed in ${pkg}"
              failed="${failed} ${pkg}:${target}"
            fi
            echo "::endgroup::"
          done

          echo "=== ${total} fuzz target(s) run ==="
          if [ -n "$failed" ]; then
            echo "::error::failing fuzz targets:${failed}"
            exit 1
          fi

  multipeer-e2e:
    # Two-peer Syncthing fixture defined in tests/multipeer/.
    # Each Go test brings up its own compose project; the cleanup step prunes
    # any leftovers from a panic or test-runner kill.
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: build`. This job builds its own image and test
    # binary; chaining it behind `build` only hid the e2e verdict whenever the
    # unit-test job was red.
    if: "!startsWith(github.event.head_commit.message, 'auto:')"
    # `go test -timeout 25m` below is the inner bound; 30 leaves room for the
    # image build and still kills a wedged Docker daemon.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build test image once (warm Docker layer cache)
        run: |
          docker build \
            -f tests/multipeer/Dockerfile.test \
            -t dotkeeper-multipeer-test:local \
            .

      - name: Run multipeer suite
        # -race builds the Go test binary with the data-race detector. The
        # detector runs inside the test process (not the dotkeeper container),
        # so it catches races in the harness and in any in-process Go code the
        # tests execute. Worth the ~10-20% overhead given the suite is the
        # exact place we'd want a race surfaced.
        run: go test -tags multipeer -race -v -timeout 25m ./tests/multipeer/...

      - name: Dump container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^dkmp-' || true); do
            echo "::group::logs $c"
            docker logs --tail 200 "$c" || true
            echo "::endgroup::"
          done

      - name: Prune leftover compose projects
        if: always()
        run: |
          for p in $(docker compose ls -aq 2>/dev/null | grep '^dkmp-' || true); do
            docker compose -p "$p" down -v --remove-orphans || true
          done
